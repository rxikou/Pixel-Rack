# Render blueprint for the PixelRack API.
# The client is deployed separately on Vercel from the client/ directory.
services:
  - type: web
    name: pixelrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Photo transformation stays off: the Gemini step bills per upload, so
      # an open endpoint on the public internet spends real money.
      - key: PIXELATION_ENABLED
        value: "false"
      # Set these in the Render dashboard rather than here, so secrets stay
      # out of the repo. Values come from the repo-root .env.local that the
      # Neon CLI manages.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      # The deployed client origin, e.g. https://pixelrack.vercel.app
      - key: CORS_ORIGINS
        sync: false
